name: xama-ong-platform

services:
  xama-db:
    image: postgres:16-alpine
    container_name: xama-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - xama_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [xama]

  xama-cache:
    image: redis:7-alpine
    container_name: xama-cache
    restart: unless-stopped
    networks: [xama]

  xama-api:
    build:
      context: ./backend
    container_name: xama-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@xama-db:5432/${POSTGRES_DB}
      REDIS_URL: redis://xama-cache:6379
      SECRET_KEY: ${SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      ENVIRONMENT: development
    ports:
      - "8100:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    depends_on:
      xama-db:
        condition: service_healthy
    networks: [xama]

  xama-web:
    build:
      context: ./frontend
    container_name: xama-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8100
    ports:
      - "3100:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/package.json:/app/package.json
      - ./frontend/next.config.js:/app/next.config.js
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
    depends_on:
      - xama-api
    networks: [xama]

volumes:
  xama_pgdata:

networks:
  xama:
    driver: bridge
