name: xama-ong-prod

services:
  xama-db:
    image: postgres:16-alpine
    container_name: xama-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - xama_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [xama-internal]

  xama-cache:
    image: redis:7-alpine
    container_name: xama-cache
    restart: always
    volumes:
      - xama_redis:/data
    networks: [xama-internal]

  xama-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: xama-api
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@xama-db:5432/${POSTGRES_DB}
      REDIS_URL: redis://xama-cache:6379
      SECRET_KEY: ${SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ENVIRONMENT: production
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on:
      xama-db:
        condition: service_healthy
    networks: [xama-internal]

  xama-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
    container_name: xama-web
    restart: always
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://xama-api:8000
    depends_on:
      - xama-api
    networks: [xama-internal]

  caddy:
    image: caddy:2-alpine
    container_name: xama-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - xama-api
      - xama-web
    networks: [xama-internal]

volumes:
  xama_pgdata:
  xama_redis:
  caddy_data:
  caddy_config:

networks:
  xama-internal:
    driver: bridge
